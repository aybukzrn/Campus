<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaydol</title>
    <link rel="stylesheet" href="design/register.css">
    <script src="https://kit.fontawesome.com/a81368914c.js"></script>
</head>
<body>
    <div class="container">

        <div class="login-container">
            <form action="login.html">
                <img class="avatar"  src="design/image/person.svg" alt="">
                <h2>HOŞ GELDİNİZ</h2>

                <div class="input-div one">
                    <div class="i">
                        <i class="fas fa-user"></i>
                    </div>
                    <div>
                        <h5>E-Posta</h5>
                        <input type="email" class="input" required>
                    </div>
                </div>

                <div class="input-div one">
                    <div class="i">
                        <i class="fas fa-user"></i>
                    </div>
                    <div>
                        <h5>Ad Soyad</h5>
                        <input type="text" class="input" required>
                        
                    </div>

                </div>

                <div class="input-div two">
                    <div class="i">
                        <i class="fas fa-lock"></i>
                    </div>
                    <div>
                        <h5>Şifre</h5>
                        <input type="password" class="input" id="passwordInput" required>

                        <img id="togglePassword" src="design/image/eye-closed.svg" alt="Göster" class="eye-icon">
                    </div>
                </div>

                

                
                <input type="submit" class="btn" value="KAYDOL">
                <a href="login.html">Zaten Üye Misin?</a>
            </form>
        </div>

        <div class="img">
            <img src="design/image/login.svg" alt="">
        </div>
    </div>
    
    <script src="design/regitser.js"></script>
</body>
</html>
